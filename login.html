<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Antrian Rumah Sakit</title>
  <link rel="stylesheet" href="style/login.css">
  <script type="module" src="dist/login.js" defer></script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1 class="login-title">Masuk</h1>
      <p class="login-subtitle">
        Masuk untuk mengakses Dashboard, Operator, Layar Antrian, dan Ambil Nomor.
      </p>

      <div id="error-alert" class="alert alert-danger hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">
          <span id="btn-text">Masuk</span>
        </button>
      </form>

      <p class="helper-text">
        Gunakan akun uji dari <a href="https://dummyjson.com/users" target="_blank" rel="noopener">dummyjson.com/users</a> (contoh username/password tercantum di sana).
      </p>
    </div>
  </div>
</body>
</html>
